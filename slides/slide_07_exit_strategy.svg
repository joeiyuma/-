<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/></filter>
</defs>
<style>text{font-family:&quot;Noto Sans CJK JP&quot;,&quot;Noto Sans JP&quot;,&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif}.small{font-size:28px}.body{font-size:34px}.lead{font-size:42px;font-weight:700}.title{font-size:64px;font-weight:800}.caption{font-size:23px}.mini{font-size:20px}</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1430" cy="110" r="170" fill="#DBEAFE" opacity="0.65"/>
<circle cx="160" cy="790" r="220" fill="#CCFBF1" opacity="0.55"/>
<text x="80" y="88" fill="#12355B" font-size="48" font-weight="800" text-anchor="start" class="">出口戦略：子ども18歳の時に暴落したら？</text>
<rect x="80" y="115" width="560" height="8" rx="4" fill="#2563EB"/>
<text x="1480" y="72" fill="#64748B" font-size="28" font-weight="700" text-anchor="end" class="">07/10</text>
<text x="100" y="158" fill="#334155" font-size="34" font-weight="700" text-anchor="start" class="">教育資金など“使う時期が決まっているお金”は、出口直前の市場下落が最大のストレスになります。</text>
<rect x="95" y="285" width="760" height="390" rx="28" fill="#FFFFFF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<polyline points="145,575 255,520 365,455 475,360 585,300 695,250 805,220" fill="none" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
<polyline points="145,575 255,520 365,455 475,360 585,520 695,610 805,500" fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
<line x1="585" y1="285" x2="585" y2="625" stroke="#EF4444" stroke-width="4" stroke-dasharray="12 12"/>
<text x="585" y="265" fill="#EF4444" font-size="28" font-weight="900" text-anchor="middle" class="">18歳・教育資金</text>
<text x="475" y="720" fill="#12355B" font-size="32" font-weight="900" text-anchor="middle" class="">必要時期が相場下落と重なるリスク</text>
<rect x="900" y="285" width="580" height="390" rx="28" fill="#FEF2F2" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<circle cx="940" cy="350" r="9" fill="#EF4444"/>
<text x="968" y="360" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">NISAは優秀でも、売却タイミングの価格変動リスクは残る</text>
<circle cx="940" cy="411" r="9" fill="#EF4444"/>
<text x="968" y="421" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">暴落後の回復には数年かかることがあり、5〜7年待つ想定が必要な局面もある</text>
<circle cx="940" cy="472" r="9" fill="#EF4444"/>
<text x="968" y="482" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">変額保険を併用し、事前にスイッチングでリスクを下げる選択肢を持つ</text>
<text x="120" y="770" fill="#0F766E" font-size="30" font-weight="900" text-anchor="start" class="">営業トーク：『増やす入口』はNISA、『使う出口』は保険も含めて二重化しましょう。</text>
<text x="80" y="852" fill="#64748B" font-size="22">NISA × 変額保険 併用提案資料｜一般情報・個別商品説明ではありません</text>
</svg>