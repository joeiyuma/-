<text x="1320" y="233" fill="#FFFFFF" font-size="38" font-weight="900" text-anchor="middle" class="">併用</text>
<circle cx="1140" cy="320" r="9" fill="#7C3AED"/>
<text x="1168" y="330" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">入口・運用・出口を分けて設計</text>
