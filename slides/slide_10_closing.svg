<text x="145" y="705" fill="#12355B" font-size="32" font-weight="900" text-anchor="start" class="">NISAは“増やす主役”。変額保険は“守りと出口の補完”。両方を持つことで、資産形成はより実行しやすくなります。</text>
<text x="110" y="815" fill="#64748B" font-size="22" font-weight="700" text-anchor="start" class="">注意：変額保険は市場リスク、費用、解約控除等により損失が生じる場合があります。NISAも元本保証ではありません。</text>
<text x="80" y="852" fill="#64748B" font-size="22">NISA × 変額保険 併用提案資料｜一般情報・個別商品説明ではありません</text>
