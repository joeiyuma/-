<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/></filter>
</defs>
<style>text{font-family:&quot;Noto Sans CJK JP&quot;,&quot;Noto Sans JP&quot;,&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif}.small{font-size:28px}.body{font-size:34px}.lead{font-size:42px;font-weight:700}.title{font-size:64px;font-weight:800}.caption{font-size:23px}.mini{font-size:20px}</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1430" cy="110" r="170" fill="#DBEAFE" opacity="0.65"/>
<circle cx="160" cy="790" r="220" fill="#CCFBF1" opacity="0.55"/>
<text x="80" y="88" fill="#12355B" font-size="48" font-weight="800" text-anchor="start" class="">NISAはまず肯定：非課税で資産形成の主役に</text>
<rect x="80" y="115" width="560" height="8" rx="4" fill="#2563EB"/>
<text x="1480" y="72" fill="#64748B" font-size="28" font-weight="700" text-anchor="end" class="">05/10</text>
<text x="100" y="160" fill="#334155" font-size="34" font-weight="700" text-anchor="start" class="">NISAは運用益が非課税。2024年以降の制度では年間投資枠が拡大し、非課税保有期間も無期限化されています。</text>
<rect x="105" y="285" width="430" height="180" rx="28" fill="#EFF6FF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="320" y="350" fill="#64748B" font-size="30" font-weight="800" text-anchor="middle" class="">年間投資枠</text>
<text x="320" y="425" fill="#2563EB" font-size="52" font-weight="900" text-anchor="middle" class="">最大360万円</text>
<rect x="595" y="285" width="430" height="180" rx="28" fill="#EFF6FF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="810" y="350" fill="#64748B" font-size="30" font-weight="800" text-anchor="middle" class="">生涯投資枠</text>
<text x="810" y="425" fill="#2563EB" font-size="52" font-weight="900" text-anchor="middle" class="">1,800万円</text>
<rect x="1085" y="285" width="430" height="180" rx="28" fill="#EFF6FF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="1300" y="350" fill="#64748B" font-size="30" font-weight="800" text-anchor="middle" class="">保有期間</text>
<text x="1300" y="425" fill="#2563EB" font-size="52" font-weight="900" text-anchor="middle" class="">無期限</text>
<circle cx="140" cy="545" r="9" fill="#2563EB"/>
<text x="168" y="555" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">つみたて投資枠：長期・積立・分散に適した投資信託が中心</text>
<circle cx="140" cy="606" r="9" fill="#2563EB"/>
<text x="168" y="616" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">成長投資枠：上場株式・投資信託等を幅広く活用可能</text>
<circle cx="140" cy="667" r="9" fill="#2563EB"/>
<text x="168" y="677" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">まずはNISAで非課税メリットを取りに行くのが基本方針</text>
<text x="100" y="805" fill="#64748B" font-size="23" font-weight="600" text-anchor="start" class="">出典：金融庁 NISA特設サイト（2026年5月確認）</text>
<text x="80" y="852" fill="#64748B" font-size="22">NISA × 変額保険 併用提案資料｜一般情報・個別商品説明ではありません</text>
</svg>