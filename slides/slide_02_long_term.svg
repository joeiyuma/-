<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/></filter>
</defs>
<style>text{font-family:&quot;Noto Sans CJK JP&quot;,&quot;Noto Sans JP&quot;,&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif}.small{font-size:28px}.body{font-size:34px}.lead{font-size:42px;font-weight:700}.title{font-size:64px;font-weight:800}.caption{font-size:23px}.mini{font-size:20px}</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1430" cy="110" r="170" fill="#DBEAFE" opacity="0.65"/>
<circle cx="160" cy="790" r="220" fill="#CCFBF1" opacity="0.55"/>
<text x="80" y="88" fill="#12355B" font-size="48" font-weight="800" text-anchor="start" class="">長期投資：時間を味方にする</text>
<rect x="80" y="115" width="560" height="8" rx="4" fill="#2563EB"/>
<text x="1480" y="72" fill="#64748B" font-size="28" font-weight="700" text-anchor="end" class="">02/10</text>
<rect x="80" y="170" width="700" height="560" rx="28" fill="#FFFFFF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<rect x="830" y="170" width="690" height="560" rx="28" fill="#F0FDF4" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="120" y="235" fill="#12355B" font-size="42" font-weight="800" text-anchor="start" class="">短期の値動きに一喜一憂するより、長く続けて複利の力を受け取る設計へ。</text>
<circle cx="130" cy="395" r="9" fill="#2563EB"/>
<text x="158" y="405" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">運用益を再投資すると、利益が次の利益を生む“複利”が働く</text>
<circle cx="130" cy="456" r="9" fill="#2563EB"/>
<text x="158" y="466" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">教育・老後・住宅など、目的別に必要時期を決めておく</text>
<circle cx="130" cy="517" r="9" fill="#2563EB"/>
<text x="158" y="527" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">長く持つほど、途中の下落を乗り越える余地が広がる</text>
<rect x="900" y="570" width="70" height="80" rx="14" fill="#22C55E"/>
<text x="935" y="690" fill="#334155" font-size="25" font-weight="700" text-anchor="middle" class="">5年</text>
<rect x="1010" y="530" width="70" height="120" rx="14" fill="#22C55E"/>
<text x="1045" y="690" fill="#334155" font-size="25" font-weight="700" text-anchor="middle" class="">10年</text>
<rect x="1120" y="460" width="70" height="190" rx="14" fill="#22C55E"/>
<text x="1155" y="690" fill="#334155" font-size="25" font-weight="700" text-anchor="middle" class="">15年</text>
<rect x="1230" y="340" width="70" height="310" rx="14" fill="#22C55E"/>
<text x="1265" y="690" fill="#334155" font-size="25" font-weight="700" text-anchor="middle" class="">20年</text>
<rect x="1340" y="150" width="70" height="500" rx="14" fill="#22C55E"/>
<text x="1375" y="690" fill="#334155" font-size="25" font-weight="700" text-anchor="middle" class="">30年</text>
<path d="M910 560 C1050 500 1160 385 1450 185" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
<text x="1170" y="260" fill="#2563EB" font-size="52" font-weight="900" text-anchor="middle" class="">時間 × 複利</text>
<text x="885" y="760" fill="#0F766E" font-size="28" font-weight="800" text-anchor="start" class="">営業トーク：『増やす方法』だけでなく『いつ使うか』まで一緒に決めましょう。</text>
<text x="80" y="852" fill="#64748B" font-size="22">NISA × 変額保険 併用提案資料｜一般情報・個別商品説明ではありません</text>
</svg>