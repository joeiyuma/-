<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/></filter>
</defs>
<style>text{font-family:&quot;Noto Sans CJK JP&quot;,&quot;Noto Sans JP&quot;,&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif}.small{font-size:28px}.body{font-size:34px}.lead{font-size:42px;font-weight:700}.title{font-size:64px;font-weight:800}.caption{font-size:23px}.mini{font-size:20px}</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1430" cy="110" r="170" fill="#DBEAFE" opacity="0.65"/>
<circle cx="160" cy="790" r="220" fill="#CCFBF1" opacity="0.55"/>
<text x="80" y="88" fill="#12355B" font-size="48" font-weight="800" text-anchor="start" class="">スイッチングによる暴落対策：使う数年前から守りへ</text>
<rect x="80" y="115" width="560" height="8" rx="4" fill="#2563EB"/>
<text x="1480" y="72" fill="#64748B" font-size="28" font-weight="700" text-anchor="end" class="">08/10</text>
<rect x="110" y="250" width="285" height="210" rx="28" fill="#EFF6FF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="252" y="320" fill="#2563EB" font-size="32" font-weight="900" text-anchor="middle" class="">10年以上前</text>
<text x="145" y="380" fill="#12355B" font-size="30" font-weight="800" text-anchor="start" class="">株式中心で成長を狙う</text>
<text x="430" y="375" fill="#64748B" font-size="58" font-weight="900" text-anchor="middle" class="">→</text>
<rect x="475" y="250" width="285" height="210" rx="28" fill="#EFF6FF" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="617" y="320" fill="#2563EB" font-size="32" font-weight="900" text-anchor="middle" class="">5〜7年前</text>
<text x="510" y="380" fill="#12355B" font-size="30" font-weight="800" text-anchor="start" class="">目標額と相場を確認</text>
<text x="795" y="375" fill="#64748B" font-size="58" font-weight="900" text-anchor="middle" class="">→</text>
<rect x="840" y="250" width="285" height="210" rx="28" fill="#F0FDF4" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="982" y="320" fill="#0F766E" font-size="32" font-weight="900" text-anchor="middle" class="">3年前</text>
<text x="875" y="380" fill="#12355B" font-size="30" font-weight="800" text-anchor="start" class="">債券・安定資産へ段階的に移す</text>
<text x="1160" y="375" fill="#64748B" font-size="58" font-weight="900" text-anchor="middle" class="">→</text>
<rect x="1205" y="250" width="285" height="210" rx="28" fill="#F0FDF4" stroke="#D8E3F0" stroke-width="2" filter="url(#shadow)"/>
<text x="1347" y="320" fill="#0F766E" font-size="32" font-weight="900" text-anchor="middle" class="">使用時期</text>
<text x="1240" y="380" fill="#12355B" font-size="30" font-weight="800" text-anchor="start" class="">必要額を取り崩す</text>
<rect x="120" y="540" width="1320" height="22" rx="11" fill="#CBD5E1"/>
<rect x="120" y="540" width="700" height="22" rx="11" fill="#2563EB"/>
<rect x="820" y="540" width="620" height="22" rx="11" fill="#0F766E"/>
<text x="470" y="600" fill="#2563EB" font-size="30" font-weight="900" text-anchor="middle" class="">成長を狙う期間</text>
<text x="1130" y="600" fill="#0F766E" font-size="30" font-weight="900" text-anchor="middle" class="">守りへ移す期間</text>
<circle cx="135" cy="685" r="9" fill="#0F766E"/>
<text x="163" y="695" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">スイッチングは“暴落後に慌てる”のではなく“暴落前に備える”考え方</text>
<circle cx="135" cy="746" r="9" fill="#0F766E"/>
<text x="163" y="756" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">保険商品ごとに対象ファンド、回数、費用、制限は異なるため事前確認が必須</text>
<circle cx="135" cy="807" r="9" fill="#0F766E"/>
<text x="163" y="817" fill="#334155" font-size="32" font-weight="600" text-anchor="start" class="">NISAの非課税成長と、変額保険の出口調整を組み合わせる</text>
<text x="80" y="852" fill="#64748B" font-size="22">NISA × 変額保険 併用提案資料｜一般情報・個別商品説明ではありません</text>
</svg>